[main]
dep_mode = manual
build_jobs = 1
editor = nano
enable_fuzzy_finder = false

[network]
id = ziokt-main
download_protocol_priority = p2p,http,git
proxy = 

[p2p]
port = 7234
stun_servers = stun.l.google.com:19302,stun.nextcloud.com:443
enable_upnp = false
auto_trust_new_nodes = false
tls_ech_enabled = false
tls_no_sni_client = true
public_ip = 43.207.75.185

[blockchain]
consensus = pos
weak_subjectivity_checkpoints = ""

[trust]
gpg_signing_key = 
require_gpg_signature = true

[gateway]
port = 8080
enabled = true

[ziokt]
enabled = TRUE
federation_id = ziokt-main
provider_id = corium-production
allow_mutations = TRUE
allowed_operations = artifact.stage,chain.mine,compute.run,compute.submit,content.publish,identity.register,recovery.checkpoint,recovery.restore,snapshot.create,strata.create,wiki.create,zkc.issue,zkn.gift,zkn.transfer
allowed_resources = *

