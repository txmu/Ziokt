<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ziokt Companion</title><link rel="stylesheet" href="popup.css"><body><main><h1>Ziokt Companion</h1><p data-i18n="intro">连接你的节点，使用授权应用。</p><label data-i18n="profiles">已保存连接<select id="profiles"><option value="">—</option></select></label><form id="connect"><label data-i18n="profile_name">连接名称<input name="profile_name" maxlength="80"></label><label data-i18n="endpoint">节点地址<input name="endpoint" type="url" value="http://127.0.0.1:8210" required></label><label data-i18n="credential">应用凭证<input name="token" type="password" autocomplete="off" required></label><button data-i18n="connect">授权此节点并连接</button></form><p id="status" role="status" aria-live="polite" data-i18n="disconnected">尚未连接</p><button id="logout" data-i18n="logout">断开并清除会话</button><details><summary data-i18n="settings">设置</summary><form id="preferences"><label data-i18n="language">语言<select name="language"><option value="auto">Auto</option><option value="zh_CN">中文</option><option value="en">English</option></select></label><label data-i18n="theme">主题<select name="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label data-i18n="font">字号<input name="fontSize" type="number" min="13" max="24" value="15"></label><label data-i18n="limit">每次加载文章数<input name="articleLimit" type="number" min="10" max="100" value="30"></label><label data-i18n="default_tab">默认应用<select name="defaultTab"><option value="news">Netnews</option><option value="books">Library</option><option value="community">Community</option><option value="applications">Applications</option></select></label><label data-i18n="compact">紧凑显示<input name="compact" type="checkbox"></label><button data-i18n="save_settings">保存设置</button></form></details><button id="open-tab" data-i18n="open_tab">在完整标签页打开</button><nav><button data-tab="news" data-i18n="news">新闻</button><button data-tab="books" data-i18n="books">图书</button><button data-tab="community" data-i18n="community">社区</button><button data-tab="applications" data-i18n="applications">应用</button></nav><section id="news"><h2 data-i18n="newsgroups">新闻组</h2><button id="groups" data-i18n="load_groups">加载新闻组</button><div id="group-list"></div><h3 id="group-name"></h3><div id="article-list"></div><article id="article"></article><form id="post"><label data-i18n="newsgroups">新闻组<input name="group" required></label><label data-i18n="subject">标题<input name="subject" required maxlength="512"></label><label data-i18n="body">正文<textarea name="body" required maxlength="8000"></textarea></label><label data-i18n="attachments">附件<input name="attachments" type="file" multiple></label><button data-i18n="publish_identity">以授权身份发布</button></form></section><section id="books" hidden><h2 data-i18n="library_search">图书检索</h2><form id="search"><label data-i18n="query">书名、作者、ISBN<input name="query" type="search"></label><button data-i18n="search">检索</button></form><div id="book-list"></div><details><summary data-i18n="upload_book">上传图书</summary><form id="publish-book"><label data-i18n="file">文件<input name="file" type="file" required></label><label data-i18n="book_title">书名<input name="title" required maxlength="512"></label><label data-i18n="author">作者<input name="author" required maxlength="512"></label><label data-i18n="license">许可证或保存权声明<input name="license" required maxlength="1024"></label><label data-i18n="visibility">传播范围<select name="visibility"><option value="private" data-i18n="private_book">私人藏书</option><option value="public" data-i18n="public_book">公开分发</option></select></label><progress id="book-progress" max="100" value="0" aria-label="Upload"></progress><button data-i18n="upload_book">上传图书</button></form></details></section><section id="community" hidden><h2>Community</h2><button id="community-list" data-i18n="community_load">加载已授权帖子</button><div id="community-posts"></div><form id="community-post"><label data-i18n="subject">标题<input name="title" required maxlength="512"></label><label data-i18n="body">正文<textarea name="body" required maxlength="2000"></textarea></label><button data-i18n="publish">发布</button></form></section><section id="applications" hidden><h2 data-i18n="node_capabilities">节点应用能力</h2><button id="capabilities" data-i18n="load_capabilities">查询实际可用能力</button><div id="capability-list"></div><p data-i18n="capability_note">消息、群组和文件功能按节点授权与实际实现显示；不会继承 Gateway 管理权限。</p></section></main><script src="application-client.js"></script><script src="popup.js"></script></body></html>
