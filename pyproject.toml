[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ziokt"
version = "0.1.0"
description = "Native opt-in Shadow6 and Corium federation"
requires-python = ">=3.11"

[project.optional-dependencies]
security = ["cryptography==50.0.1"]

[project.scripts]
ziokt = "ziokt.cli:main"
openci = "openci.cli:main"

[tool.setuptools]
packages = ["ziokt", "openci"]

[tool.setuptools.package-data]
ziokt = ["web/*.html", "web/*.css", "web/*.js", "effort/*", "explorer/*", "ecosystem.json"]
