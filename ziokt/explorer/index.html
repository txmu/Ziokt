<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ziokt 区块浏览器</title><link rel="stylesheet" href="/explorer/style.css"><main><h1 id="title">Ziokt 区块浏览器</h1><p id="notice">只读查看本节点的规范链。确认数可能随分叉变化，不代表不可逆最终性。交易正文与加密回执不会在此展示。</p><p><a href="/">奋斗 · Contribute</a></p><div id="summary" role="status" aria-live="polite"></div><nav aria-label="浏览 · Browse"><button id="refresh" type="button">刷新</button><button id="home" type="button">最新区块</button><button id="pending" type="button">待处理交易</button><button id="alltx" type="button">全部交易</button><button id="upgrades" type="button">原生升级与贡献结算</button><button id="genesis" type="button">创世区块</button></nav><form id="search"><label id="label" for="lookup">区块高度、区块哈希或交易哈希</label><input id="lookup" maxlength="64" required autocomplete="off" autocapitalize="none" spellcheck="false"><button id="find">查询</button></form><section aria-labelledby="detail-title"><h2 id="detail-title">查询详情</h2><div id="detail-nav"></div><pre id="detail" tabindex="0" aria-live="polite"></pre><button id="export" type="button" hidden>导出此查询 JSON</button><div id="transactions"></div><button id="txmore" type="button" hidden>更多交易</button></section><h2 id="activity-title">近期区块活动</h2><p id="activity-note">最近 20 个区块的交易数量</p><div id="activity" role="list"></div><h2 id="recent">最近区块</h2><div id="blocks"></div><button id="more" type="button">更早区块</button><p id="status" role="status" aria-live="polite"></p><noscript>需要 JavaScript 读取节点数据。JavaScript is required to query the node.</noscript></main><script src="/explorer/app.js" defer></script></html>
