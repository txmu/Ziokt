<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Ziokt 区块浏览器</title><link rel="stylesheet" href="/explorer/style.css"></head>
<body><a class="skip" href="#content">跳到内容 / Skip to content</a><main id="content">
<header><div><p class="eyebrow">ZIOKT / NETWORK OBSERVATORY</p><h1 id="title">Ziokt 区块浏览器</h1></div><nav aria-label="应用 · Applications"><a href="/">奋斗 · Contribute</a><a href="/p2p/">P2P</a></nav></header>
<p id="notice">查看网络的主链与 DNA 侧链，追踪区块、编码和 RNA 流转。</p>
<section class="panel" aria-labelledby="network-title"><h2 id="network-title">网络与来源</h2>
<div class="selectors"><label><span id="source-label">来源</span><select id="source"><option value="local">本节点 · This node</option></select></label><label><span id="network-label">网络</span><select id="network"><option value="main">主链网络 · Main network</option></select></label><label><span id="chain-label">链</span><select id="chain"><option value="primary">主链 · Primary</option><option value="dna">DNA 侧链 · DNA sidechain</option></select></label></div>
<form id="source-form"><label for="source-url" id="source-url-label">添加兼容 DNA 的浏览器 API 来源</label><input id="source-url" type="url" maxlength="2048" placeholder="https://node.example/api/explorer/" autocomplete="off" spellcheck="false"><button id="source-load" type="submit">加载来源</button><button id="source-save" type="button">保存到此浏览器</button><button id="source-forget" type="button">移除来源</button></form>
<p class="muted" id="source-status" role="status" aria-live="polite">默认打开本节点主链。保存的公开来源留在当前浏览器。</p><div id="pair" class="pair" aria-live="polite"></div></section>
<div id="summary" class="panel" role="status" aria-live="polite"></div>
<nav class="toolbar" aria-label="浏览 · Browse"><button id="refresh" type="button">刷新</button><button id="home" type="button">最新区块</button><button id="pending" type="button">待处理交易</button><button id="alltx" type="button">全部交易</button><button id="upgrades" type="button">原生升级与贡献结算</button><button id="genesis" type="button">创世区块</button><button id="dna-view" type="button">DNA 编码</button><button id="rna-view" type="button">RNA 流转</button></nav>
<form id="search"><label id="label" for="lookup">区块高度、区块哈希或交易哈希</label><input id="lookup" maxlength="64" required autocomplete="off" autocapitalize="none" spellcheck="false"><button id="find">查询</button></form>
<section class="panel" aria-labelledby="detail-title"><h2 id="detail-title">查询详情</h2><div id="detail-nav"></div><pre id="detail" tabindex="0" aria-live="polite"></pre><div id="encoding"></div><button id="export" type="button" hidden>导出此查询 JSON</button><div id="transactions"></div><button id="txmore" type="button" hidden>更多交易</button></section>
<section aria-labelledby="activity-title"><h2 id="activity-title">近期区块活动</h2><p id="activity-note">最近 20 个区块的交易数量</p><div id="activity" role="list"></div></section>
<section aria-labelledby="recent"><h2 id="recent">最近区块</h2><div id="blocks"></div><button id="more" type="button">更早区块</button></section><p id="status" role="status" aria-live="polite"></p><noscript>需要 JavaScript 读取节点数据。JavaScript is required to query the node.</noscript></main><script src="/explorer/app.js" defer></script></body></html>
