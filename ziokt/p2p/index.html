<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Ziokt P2P 浏览器</title><link rel="stylesheet" href="/p2p/style.css"></head><body><a class="skip" href="#content">跳到内容 / Skip to content</a><main id="content"><header><div><p class="eyebrow">ZIOKT / PEER OBSERVATORY</p><h1 id="title">P2P 节点关系</h1></div><nav aria-label="应用 · Applications"><a href="/">奋斗 · Contribute</a><a href="/explorer/">区块链 · Chains</a></nav></header><p id="intro">查看各组件的节点、连接、路由与签名公告。</p>
<section class="panel"><h2 id="connection-title">连接来源</h2><form id="connect"><label for="endpoint" id="endpoint-label">P2P 浏览器 API</label><input id="endpoint" type="url" maxlength="2048" autocomplete="off" spellcheck="false"><label for="credential" id="credential-label">查看凭据</label><input id="credential" type="password" maxlength="2048" autocomplete="off"><button id="load" type="submit">连接并刷新</button><button id="save" type="button">保存公开来源</button><button id="forget" type="button">清除保存的来源</button></form><label for="saved" id="saved-label">已保存的来源</label><select id="saved"><option value="">选择来源 · Choose a source</option></select><p id="connection-status" role="status" aria-live="polite"></p></section>
<section class="panel"><h2 id="permissions-title">查看范围</h2><div class="permissions"><label><input id="addresses" type="checkbox"> <span id="addresses-label">显示地址</span></label><label><input id="identities" type="checkbox"> <span id="identities-label">显示原生身份</span></label><label><input id="cbb" type="checkbox"> <span id="cbb-label">读取 CBB 公告</span></label><label><input id="bodies" type="checkbox"> <span id="bodies-label">显示公告正文</span></label></div><p id="privacy" aria-live="polite">默认使用会话别名，地址保持隐藏。</p></section>
<div id="summary" class="panel" role="status" aria-live="polite"></div><section class="panel"><h2 id="graph-title">节点关系图</h2><p id="graph-note">选择节点查看详情；列表提供相同的数据。</p><svg id="graph" role="img" aria-label="P2P 节点关系图" viewBox="0 0 960 480"></svg><pre id="detail" tabindex="0"></pre></section>
<section class="panel"><h2 id="sources-title">组件与 Adapter</h2><div id="sources"></div><p id="components"></p></section><section><h2 id="nodes-title">节点</h2><div id="nodes"></div></section><section class="panel"><h2 id="cbb-title">CBB 签名公告</h2><div id="messages"></div></section><button id="export" type="button" disabled>导出当前可见数据</button><p id="status" role="status" aria-live="polite"></p></main><script src="/p2p/app.js" defer></script></body></html>
