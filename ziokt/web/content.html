<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ziokt Library & Netnews</title><link rel="stylesheet" href="content.css"><body>
<a class="skip" href="#main">跳到内容</a><header><div><strong>Ziokt</strong><span>Library / Netnews</span></div><nav aria-label="应用"><button id="library-tab" aria-pressed="true">图书馆</button><button id="news-tab" aria-pressed="false">新闻组</button></nav><button id="theme">切换明暗</button></header>
<main id="main"><section class="connect"><h1>你的内容网络</h1><p>阅读馆藏，参与讨论。公共发布会进入联邦目录；私人内容仅保存在你的账户。</p><form id="connect"><label for="credential">应用访问凭证</label><input id="credential" type="password" autocomplete="off" required><button>连接</button></form><p id="status" role="status" aria-live="polite">尚未连接</p></section>
<section id="library"><div class="bar"><h2>图书馆</h2><form id="search"><label for="query">搜索书名、作者或 ISBN</label><input id="query" type="search"><button>搜索</button></form></div><div id="books" class="cards"></div><details><summary>上传与出版</summary><form id="publish"><label>文件（浏览器上限 16 MiB）<input name="file" type="file" required></label><label>书名<input name="title" required maxlength="512"></label><label>作者<input name="author" required maxlength="512"></label><label>作品标识<input name="work" required maxlength="128"></label><label>版本标识<input name="edition" required maxlength="128"></label><label>许可证或保存权声明<input name="license" required maxlength="1024"></label><label>传播范围<select name="visibility"><option value="private">私人藏书</option><option value="public">公开分发（确认有传播权）</option></select></label><progress id="upload-progress" max="100" value="0" aria-label="上传进度"></progress><button>上传并保存书目</button></form></details><section id="reader" hidden><div class="bar"><h2 id="reader-title">阅读</h2><button id="larger">增大字体</button><button id="bookmark">保存书签</button><button id="reader-close">关闭</button></div><p id="reader-notice"></p><pre id="reader-text" tabindex="0"></pre></section></section>
<section id="news" hidden><h2>新闻组</h2><div class="news-layout"><aside><button id="refresh-groups">刷新新闻组</button><div id="groups"></div><details><summary>创建新闻组</summary><form id="new-group"><label>组名<input name="name" placeholder="books.open" required></label><label>描述<input name="description"></label><button>创建公开组</button></form></details></aside><section><h3 id="group-title">选择新闻组</h3><button id="subscribe" disabled>订阅此组</button><div id="articles"></div></section><article><h3 id="article-title">选择文章</h3><p id="article-meta"></p><pre id="article-body"></pre><button id="reply" disabled>回复</button></article></div><details open><summary>发布文章</summary><form id="post"><label>新闻组<input name="group" required></label><label>标题<input name="subject" required maxlength="512"></label><label>正文<textarea name="body" required maxlength="16000"></textarea></label><button>发布</button></form></details></section></main><script src="content.js" defer></script></body></html>
