<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ziokt Community</title><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head>
<body><a class="skip" href="#main">跳到内容</a><header><div><span class="brand">Ziokt</span><span class="subtitle">Community</span></div><p id="status">本地社区空间</p></header>
<section id="login"><h1>打开你的社区</h1><p>输入本机启动时保存的会话凭据。</p><form id="session"><label for="token">会话凭据</label><input id="token" type="password" autocomplete="off" required><button>打开社区</button></form></section>
<div id="workspace" hidden><nav id="navigation" aria-label="社区应用"></nav><main id="main"><div class="heading"><div><h1 id="title"></h1><p id="description"></p></div><button id="refresh" type="button">刷新</button></div><p id="feedback" role="status" aria-live="polite"></p><section id="content" aria-label="社区内容"></section><section id="compose"><h2>发布内容</h2><form id="publish"><label for="object-key">内容标识</label><input id="object-key" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}" maxlength="64"><p class="hint">使用字母、数字、点、下划线或连字符。相同标识用于更新同一份内容。</p><div id="fields"></div><button id="submit">签名并发布</button></form></section></main></div><footer>数据保存在本地加密副本中。网络同步和原生部署按各自授权执行。</footer></body></html>
