<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13243b"><title>网页管理</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<header><h1 id="site-title">网页管理</h1><label for="language" data-i18n="language">Language</label><select id="language"><option value="en">English</option><option value="zh-CN">简体中文</option></select><button id="install" hidden data-i18n="install">Install app</button><button id="notifications" data-i18n="notifications">Enable notifications</button><button id="logout" hidden data-i18n="logout">Sign out</button></header>
<p id="status" role="status" aria-live="polite"></p>
<form id="login"><label for="username" data-i18n="username">Username</label><input id="username" autocomplete="username" required maxlength="32"><label for="password" data-i18n="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"><button data-i18n="login">Sign in</button></form>
<main id="workspace" hidden><aside><h2 data-i18n="contacts">Contacts</h2><div id="contacts"></div><form id="add-contact"><label for="contact-id" data-i18n="contactId">Contact ID</label><input id="contact-id" required><button data-i18n="add">Add</button></form><details id="admin" hidden><summary data-i18n="manage">Manage users</summary><form id="site-settings"><label for="page-title" data-i18n="pageTitle">Page title</label><input id="page-title" maxlength="80" required><button data-i18n="saveTitle">Save title</button></form><p id="integration" role="status"></p><form id="create-user"><label for="new-user" data-i18n="username">Username</label><input id="new-user" required><label for="new-name" data-i18n="name">Name</label><input id="new-name" required><label for="new-password" data-i18n="password">Password</label><input id="new-password" type="password" required minlength="12"><button data-i18n="create">Create</button></form></details><p id="my-id"></p></aside><section><h2 id="peer-title" data-i18n="selectContact">Select a contact</h2><p id="fingerprint"></p><div id="messages" role="log" aria-live="polite"></div><form id="composer"><label for="text" data-i18n="message">Message</label><textarea id="text" maxlength="1000" required></textarea><button data-i18n="send">Send</button></form><label for="media" data-i18n="attachment">Photo, video or audio</label><input id="media" type="file" accept="image/*,video/*,audio/*"></section></main>
</body></html>
