<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101417"><meta name="color-scheme" content="dark"><meta name="mobile-web-app-capable" content="yes"><title>腕聊</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"></head><body>
<main id="login" class="login"><form id="loginForm" class="login-box"><h1>腕聊</h1><p>登录你的账户</p><input id="username" autocomplete="username" maxlength="24" placeholder="用户名" aria-label="用户名" required><input id="password" type="password" autocomplete="current-password" maxlength="64" placeholder="密码" aria-label="密码" required><button type="submit">进入</button><output id="loginError" class="error" aria-live="polite"></output></form></main>
<main id="app" class="app" hidden><header><button id="backButton" class="head-button" hidden aria-label="返回">‹</button><strong id="title">联系人</strong><span id="status">连接中</span><button id="adminButton" class="head-button" hidden aria-label="管理用户">管</button><button id="logoutButton" class="head-button" aria-label="退出">退</button></header>
<section id="contacts" class="list" aria-label="联系人"></section>
<section id="messages" class="messages" hidden aria-live="polite"></section>
<form id="composer" class="composer" hidden><label class="media-button" aria-label="发送图片">图<input id="imageInput" type="file" accept="image/*"></label><label class="media-button" aria-label="发送视频">视<input id="videoInput" type="file" accept="video/mp4,video/webm"></label><button id="recordButton" class="media-button" type="button" aria-label="录制语音">音</button><input id="textInput" type="text" maxlength="1000" enterkeyhint="send" autocomplete="off" placeholder="消息…" aria-label="消息"><button type="submit">发</button></form>
<section id="admin" class="admin" hidden><form id="userForm" class="user-form"><h2>新建用户</h2><input id="newUsername" maxlength="24" placeholder="登录名" required><input id="newName" maxlength="24" placeholder="显示昵称" required><input id="newPassword" type="password" minlength="4" placeholder="初始密码" required><button type="submit">创建用户</button></form><h2>用户与联系人</h2><p class="hint">点选某用户，再勾选其可聊天联系人；关系双向生效。</p><div id="adminUsers" class="admin-users"></div><div id="contactEditor" class="contact-editor"></div></section>
</main><div id="notice" class="notice" role="status" aria-live="polite"></div><script src="/app.js" defer></script></body></html>
