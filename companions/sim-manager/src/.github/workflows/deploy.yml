name: Deploy to GitHub Pages

on:
  # 当推送到 main 分支时触发
  push:
    branches: ["main"]
  # 允许在 Actions 标签页手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署，跳过正在运行的构建
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          # 如果你的 package.json 不在根目录，取消下面这行的注释并修改路径
          # cache-dependency-path: './sim-manager-app/package-lock.json'

      - name: Install dependencies
        run: npm ci
        # 如果你的项目在子目录（例如 sim-manager-app），需要取消下面这行的注释
        # working-directory: ./sim-manager-app

      - name: Build
        run: npm run build
        # 如果你的项目在子目录，同样需要指定工作目录
        # working-directory: ./sim-manager-app

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传构建产物文件夹
          # 如果在根目录，通常是 './dist'。如果在子目录，可能是 './sim-manager-app/dist'
          path: './dist'

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
