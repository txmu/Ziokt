name: Ziokt native federation and regression tests
on:
  push:
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
    inputs:
      rebuild_native:
        description: Rebuild changed native Core sources in CI
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ziokt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Ziokt
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: Ziokt
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_protocol.py -v
      - run: python -m unittest discover -s tests -p test_business.py -v
      - run: python -m unittest discover -s tests -p test_data_channel.py -v
      - run: python -m unittest discover -s tests -p test_zkt.py -v
      - name: Community applications, node loss and encrypted recovery
        run: python -m unittest discover -s tests -p 'test_community*.py' -v
      - name: Offline capsules and isolated site hosting
        run: python -m unittest discover -s tests -p test_capsule_and_site_hosting.py -v
      - run: python ci/build.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ziokt-${{ matrix.os }}
          path: Ziokt/dist/ziokt.pyz
          if-no-files-found: error
  anonymous-carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Ziokt
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: Ziokt
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y tor
      - name: Actual onion services, nested SOCKS hop and mTLS community exchange
        env:
          ZIOKT_TOR_LIVE: '1'
        run: python -m unittest discover -s tests -p test_tor_live.py -v
  nested-nat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iptables
      - name: Real double NAT, keyless peer multihop, opaque relay and changed client address
        run: sudo env PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" bash ci/run-nat.sh
  i2p-carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Ziokt
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: Ziokt
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Actual I2P router, SAM, public tunnels and community mTLS
        run: bash ci/run-i2p.sh
  native-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Ziokt
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: Ziokt
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - id: native
        run: python ci/native_refs.py
      - uses: actions/checkout@v7.0.1
        with:
          repository: txmu/Shadow6
          ref: ${{ steps.native.outputs.shadow6 }}
          path: Shadow6
      - uses: actions/checkout@v7.0.1
        with:
          repository: txmu/Corium
          ref: ${{ steps.native.outputs.corium }}
          path: Corium
          ssh-key: ${{ secrets.CORIUM_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild_native
        with:
          go-version-file: Shadow6/Core-Go/go.mod
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild_native
      - name: Native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 jq openssl curl rsync gnupg libsctp1 chezscheme libsodium23 libunistring5
          sudo ln -sf $(which chezscheme) /usr/local/bin/chez || true
          python -m pip install -r ../Shadow6/requirements.txt
          python -m pip install --only-binary=:all: -r requirements-dns.txt
      - name: Restore verified unchanged Core products for all Profile tests
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild_native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download native-baseline-14a75b57 --repo txmu/Ziokt --pattern Shadow6.tar.gz --dir baseline-download
          python ci/restore_native_baseline.py baseline-download/Shadow6.tar.gz
      - name: Reuse pinned CI products without recompiling unchanged native families
        if: github.event_name != 'workflow_dispatch' || !inputs.rebuild_native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38484382737 --repo txmu/Ziokt --name ziokt-enabled-native-artifacts --dir reuse-download
          archive=$(find reuse-download -name shadow6-ziokt.tar.gz -type f -print -quit)
          python ci/verify_native_reuse.py "$archive"
          python ci/restore_native_baseline.py "$archive" ci/native-reuse.lock.json
      - name: Verify interpreted Shadow6 support against reused native products
        if: github.event_name != 'workflow_dispatch' || !inputs.rebuild_native
        working-directory: Shadow6
        run: make ziokt-test PYTHON=python
      - name: Build Shadow6 with native Ziokt support (runtime remains opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild_native
        working-directory: Shadow6
        run: |
          ./configure --disable-all --disable-cores --enable-core-go --enable-core-rust --enable-control --enable-ziokt
          make build PYTHON=python
          make ziokt-test PYTHON=python
      - uses: jiro4989/setup-nim-action@v2
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild_native
        with:
          nim-version: '2.2.10'
      - name: Compile pinned RTC and the updated Nim L5 and restored L0
        id: nim
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild_native
        working-directory: Shadow6
        run: |
          set -euo pipefail
          sudo apt-get install -y cmake libssl-dev libsodium-dev
          git clone --no-checkout https://github.com/paullouisageneau/libdatachannel.git "$RUNNER_TEMP/ziokt-rtc"
          git -C "$RUNNER_TEMP/ziokt-rtc" checkout --detach c7428680803bf3f2a629a83081bf231a5e5600bd
          git -C "$RUNNER_TEMP/ziokt-rtc" submodule update --init --recursive --depth 1
          cmake -S "$RUNNER_TEMP/ziokt-rtc" -B "$RUNNER_TEMP/ziokt-rtc-build" -DCMAKE_BUILD_TYPE=Release -DNO_TESTS=ON -DNO_EXAMPLES=ON -DNO_MEDIA=ON -DNO_WEBSOCKET=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/ziokt-rtc-build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/ziokt-rtc-build"
          sudo ldconfig
          cp -L /usr/local/lib/libdatachannel.so.0.23 Core-Nim/libdatachannel.so.0.23
          make core-nim nim-crosed-variant test-nim PYTHON=python
          sha256sum Core-Nim/shadow6-nim Core-Nim/shadow6-nim-crosed Core-Nim/libdatachannel.so.0.23 > Core-Nim/runtime-sha256.txt
      - name: Preserve the same-commit tested Nim runtime for diagnosis
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ziokt-nim-${{ github.sha }}
          path: |
            Shadow6/Core-Nim/shadow6-nim
            Shadow6/Core-Nim/shadow6-nim-crosed
            Shadow6/Core-Nim/libdatachannel.so.0.23
            Shadow6/Core-Nim/runtime-sha256.txt
          if-no-files-found: error
      - name: Actual Nim relay-only ICE through a temporary local TURN server
        working-directory: Shadow6
        run: |
          set -euo pipefail
          sudo apt-get install -y coturn
          turnserver --no-cli --no-tls --no-dtls --lt-cred-mech --user ziokt:ci-only --realm ziokt-ci --listening-ip 127.0.0.1 --relay-ip 127.0.0.1 --listening-port 34780 --min-port 34800 --max-port 34820 --allow-loopback-peers --log-file "$RUNNER_TEMP/ziokt-turn.log" --pidfile "$RUNNER_TEMP/ziokt-turn.pid" > "$RUNNER_TEMP/ziokt-turn-output.log" 2>&1 &
          turn_pid=$!
          trap 'result=$?; kill "$turn_pid" 2>/dev/null || true; wait "$turn_pid" 2>/dev/null || true; tail -n 80 -- "$RUNNER_TEMP"/ziokt-turn*.log || true; exit "$result"' EXIT
          sleep 2
          kill -0 "$turn_pid"
          LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/Shadow6/Core-Nim:${LD_LIBRARY_PATH:-}" SHADOW6_TEST_TURN=turn:ziokt:ci-only@127.0.0.1:34780 python Core-Nim/test_core.py CoreTests.test_actual_webrtc_loopback_relay
      - name: Verify Corium single-file production artifact
        working-directory: Corium
        run: |
          bash -n corix_v108.sh
          python ci/static-checks.py
          python -m unittest -v test_ziokt test_zkt test_gateway test_forum_v3 test_engine_weights test_engine_governance_cli
      - name: Verify six isolated signed Extensions with runner user namespaces
        run: |
          original_apparmor_userns="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          restore_userns_policy() {
            if [[ "$original_apparmor_userns" == 1 ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1; fi
          }
          trap restore_userns_policy EXIT
          if [[ "$original_apparmor_userns" == 1 ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-current-user --net true
          ZIOKT_EXTENSION_DIAGNOSTICS=1 ZIOKT_EXTENSION_ROOT="${GITHUB_WORKSPACE}/Shadow6" ZIOKT_REQUIRE_EXTENSION_MATRIX=1 python -m unittest discover -s tests -p test_extensions_ziokt.py -v
      - name: Full Ziokt contract and native integration suites
        run: |
          python tools/sync_providers.py --check
          LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/Shadow6/Core-Nim:${GITHUB_WORKSPACE}/Shadow6/Core-Idris:${LD_LIBRARY_PATH:-}" ZIOKT_NATIVE_DATA_TEST=1 ZIOKT_EXTENSION_DIAGNOSTICS=1 ZIOKT_EXTENSION_ROOT="${GITHUB_WORKSPACE}/Shadow6" ZIOKT_REQUIRE_EXTENSION_MATRIX=1 python -m unittest discover -s tests -v
          python ci/build.py
      - name: Package tested native support artifacts and joint text source
        run: |
          python ci/package_native.py
          python tools/package_joint_source.py --output dist/Ziokt-Corium-Shadow6-source.zip
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: ziokt-enabled-native-artifacts
          path: |
            Ziokt/dist/
          if-no-files-found: error
