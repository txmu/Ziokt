name: Ziokt Unified Graphical Client CI & Release Artifacts
on:
  push:
    paths:
      - 'gui/**'
      - '.github/workflows/gui-release.yml'
      - 'gateway/**'
  pull_request:
    paths:
      - 'gui/**'
      - '.github/workflows/gui-release.yml'
      - 'gateway/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ziokt-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: GUI Automated Tests & Asset Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Web Frontend & Validate Staging
        run: |
          cd gui
          node build.js

      - name: Run GUI End-to-End Test Suite
        run: |
          python3 gui/tests/test_gui_e2e.py

      - run: npm ci --prefix gui --no-audit --no-fund
      - run: cd gui && npx tauri icon src/icons/icon-512.png

      - name: Install isolated browser for actual GUI interaction
        run: |
          npm ci --prefix ci/browser --ignore-scripts --no-audit --no-fund
          node ci/browser/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Real browser GUI upload and read-back verification
        run: node tools/gui_browser_smoke.cjs

      - name: Check Rust Core & Tauri 2 Config
        run: |
          cd gui/src-tauri
          cargo test --lib --locked --manifest-path Cargo.toml

  build-linux:
    name: Build Linux Desktop (Deb / AppImage)
    needs: test-and-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Stage Assets
        run: |
          cd gui
          node build.js

      - run: npm ci --prefix gui --no-audit --no-fund
      - run: cd gui && npx tauri icon src/icons/icon-512.png
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: gui
          args: --bundles deb,appimage
      - name: Upload Real Linux Installers
        uses: actions/upload-artifact@v4
        with:
          name: ziokt-desktop-linux
          path: |
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows Desktop (MSI / NSIS)
    needs: test-and-validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Stage Web Assets
        run: |
          cd gui
          node build.js

      - run: npm ci --prefix gui --no-audit --no-fund
      - run: cd gui && npx tauri icon src/icons/icon-512.png
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: gui
          args: --bundles nsis,msi
      - name: Upload Real Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: ziokt-desktop-windows
          path: |
            gui/src-tauri/target/release/bundle/nsis/*.exe
            gui/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-macos:
    name: Build macOS GUI (${{ matrix.target }})
    needs: test-and-validate
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: node gui/build.js
      - run: npm ci --prefix gui --no-audit --no-fund
      - run: cd gui && npx tauri icon src/icons/icon-512.png
      - uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: gui
          args: --target ${{ matrix.target }} --bundles dmg,app
      - uses: actions/upload-artifact@v4
        with:
          name: ziokt-desktop-macos-${{ matrix.target }}
          path: gui/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  build-android-and-harmonyos:
    name: Build Android APK (HarmonyOS source wrapper is not a signed HAP)
    needs: test-and-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage Mobile Assets
        run: |
          cd gui
          node build.js

      - name: Package HarmonyOS NEXT ArkUI Bundle
        run: |
          mkdir -p build-output/harmonyos
          mkdir -p gui/harmonyos/entry/src/main/resources/rawfile
          cp -r gui/dist/* gui/harmonyos/entry/src/main/resources/rawfile/
          rm -rf gui/harmonyos/entry/src/main/resources/rawfile/downloads
          tar -czf build-output/harmonyos/ziokt-mobile-harmonyos-next.tar.gz -C gui harmonyos

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt zipalign apksigner

      - name: Build Standalone Android APK Application
        env:
          ZIOKT_ANDROID_KEYSTORE_BASE64: ${{ secrets.GUI_ANDROID_KEYSTORE_BASE64 }}
          ZIOKT_ANDROID_STORE_PASSWORD: ${{ secrets.GUI_ANDROID_STORE_PASSWORD }}
          ZIOKT_ANDROID_KEY_ALIAS: ziokt-release
        run: |
          chmod +x gui/build_android.sh
          ./gui/build_android.sh
          mkdir -p build-output/android
          cp gui/downloads/ziokt-mobile-android.apk build-output/android/ziokt-mobile-android.apk
          if [ -f gui/downloads/ziokt-mobile-android.apk.idsig ]; then cp gui/downloads/ziokt-mobile-android.apk.idsig build-output/android/; fi

      - name: Upload Mobile Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ziokt-mobile-packages
          path: build-output/
          if-no-files-found: error

  publish-web-pwa:
    name: Package Standalone Web PWA & Gateway Embed
    needs: test-and-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web Bundle
        run: |
          cd gui
          node build.js

      - name: Archive Web PWA Release
        run: |
          mkdir -p build-output/web
          tar -czf build-output/web/ziokt-web-pwa.tar.gz -C gui/dist .

      - name: Upload Web PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ziokt-web-pwa
          path: build-output/web/
          if-no-files-found: error
