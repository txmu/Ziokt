name: ETP TCP native build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-tcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companions/etp/src
      - name: Build native gateway and test TCP packet framing
        working-directory: companions/etp/src
        run: |
          cargo test --locked --features tc16-tcc,dsl-runtime,ultrafileserver,ens-gateway,smart-contracts,safefs --example ziokt_gateway tcp_transport::tests::actual_tcp_packets_preserve_both_endpoint_ports_and_bounds -- --exact
          cargo build --locked --features tc16-tcc,dsl-runtime,ultrafileserver,ens-gateway,smart-contracts,safefs --example ziokt_gateway
          strip target/debug/examples/ziokt_gateway
          sha256sum target/debug/examples/ziokt_gateway > target/debug/examples/ziokt_gateway.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ziokt-etp-tcp-native
          path: |
            companions/etp/src/target/debug/examples/ziokt_gateway
            companions/etp/src/target/debug/examples/ziokt_gateway.sha256
