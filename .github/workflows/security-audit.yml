name: Reviewed production source security audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - id: native
        run: python ci/native_refs.py
      - uses: actions/checkout@v7.0.1
        with:
          repository: txmu/Corium
          ref: ${{ steps.native.outputs.corium }}
          path: Corium
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: txmu/Shadow6
          ref: ${{ steps.native.outputs.shadow6 }}
          path: Shadow6
          persist-credentials: false
      - name: Verify generated runtime against audited source components
        run: python tools/sync_providers.py --check --corium Corium --shadow6 Shadow6
      - run: |
          python -m pip install --only-binary=:all: semgrep==1.182.1 bandit==1.9.4
      - name: Scan active sources and require manual review of new findings
        run: |
          semgrep scan --config p/security-audit --config p/secrets --metrics=off --jobs 2 --max-memory 512 --timeout 10 --max-target-bytes 1000000 --exclude ziokt/_runtime.py --no-git-ignore --json -o semgrep.json ziokt spec openci tools ci
          bandit -r ziokt spec openci tools ci -ll -ii -f json -o bandit.json --quiet || result=$?
          test "${result:-0}" -le 1
          python ci/audit_gate.py --semgrep semgrep.json --bandit bandit.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: source-security-scan-evidence
          path: |
            semgrep.json
            bandit.json
