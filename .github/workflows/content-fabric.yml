name: Content Fabric and native compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Durable filesystem, TCP NNTP, scopes, three independent HTTP nodes
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_content*.py' -v 2>&1 | tee content-test-results.txt
          python -m unittest discover -s tests -p 'test_community_application.py' -v 2>&1 | tee community-application-results.txt
          python -m unittest discover -s tests -p 'test_tc16_spec.py' -v 2>&1 | tee tc16-python-results.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: content-network-evidence
          path: '*results.txt'
  native-replicas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        copies: [1, 3, 5]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build native runners only in CI
        working-directory: companions/etp/src
        run: cargo build --locked --example mailbox_replica_runner --example tc16_unified_runner --example ziokt_gateway --features persistence
      - name: Native v2 backward compatibility and signature rejection
        working-directory: companions/etp/src
        run: cargo test --locked --features persistence plugin::flavors::mailbox::tests
      - name: Real independent replica processes, outage and tombstone recovery
        run: |
          set -o pipefail
          python ci/mailbox_multinode.py companions/etp/src/target/debug/examples/mailbox_replica_runner ${{ matrix.copies }} | tee mailbox-${{ matrix.copies }}-results.txt
      - name: Same binaries on independent Python and Rust Unified executors
        run: |
          set -o pipefail
          PYTHONPATH=. python ci/tc16_differential.py companions/etp/src/target/debug/examples/tc16_unified_runner | tee tc16-differential-results.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-replicas-${{ matrix.copies }}-evidence
          path: '*results.txt'
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix ci/browser --ignore-scripts --no-audit --no-fund
      - run: node ci/browser/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Real browser application flows
        run: |
          set -o pipefail
          node tools/content_browser_smoke.cjs | tee browser-results.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: content-browser-evidence
          path: browser-results.txt
