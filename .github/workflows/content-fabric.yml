name: Content Fabric and native compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package_all:
        description: Package the tested sources, native runners, GUI and WebExtensions
        type: boolean
        default: false
concurrency:
  group: content-fabric-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  content-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Durable filesystem, TCP NNTP, scopes, three independent HTTP nodes
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_content*.py' -v 2>&1 | tee content-test-results.txt
          python -m unittest discover -s tests -p 'test_library_formats.py' -v 2>&1 | tee library-format-results.txt
          python -m unittest discover -s tests -p 'test_optimization.py' -v 2>&1 | tee optimization-results.txt
          python -m unittest discover -s tests -p 'test_airgap.py' -v 2>&1 | tee airgap-results.txt
          python -m unittest discover -s tests -p 'test_webextensions.py' -v 2>&1 | tee webextension-package-results.txt
          python -m unittest discover -s tests -p 'test_netnews_feed.py' -v 2>&1 | tee nntp-feed-results.txt
          python -m unittest discover -s tests -p 'test_community_application.py' -v 2>&1 | tee community-application-results.txt
          python -m unittest discover -s tests -p 'test_tc16_spec.py' -v 2>&1 | tee tc16-python-results.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: content-network-evidence
          path: '*results.txt'
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build native runners only in CI
        working-directory: companions/etp/src
        run: cargo build --locked --example mailbox_replica_runner --example tc16_unified_runner --example tc16_legacy_compiler --example ziokt_gateway --features persistence,tc16-tcc
      - name: Native Legacy compiler and failure-semantics regressions
        working-directory: companions/etp/src
        run: cargo test --locked --features persistence,tc16-tcc extensions::tc16_tcc::regression_tests
      - name: Native v2 backward compatibility and signature rejection
        working-directory: companions/etp/src
        run: cargo test --locked --features persistence plugin::flavors::mailbox::tests
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-content-runners
          path: |
            companions/etp/src/target/debug/examples/mailbox_replica_runner
            companions/etp/src/target/debug/examples/tc16_unified_runner
            companions/etp/src/target/debug/examples/tc16_legacy_compiler
            companions/etp/src/target/debug/examples/ziokt_gateway
          if-no-files-found: error
  native-replicas:
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        copies: [1, 3, 5]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8.0.1
        with:
          name: native-content-runners
          path: dist/native
      - run: chmod 755 dist/native/*
      - name: Real independent replica processes, outage and tombstone recovery
        run: |
          set -o pipefail
          python ci/mailbox_multinode.py dist/native/mailbox_replica_runner ${{ matrix.copies }} | tee mailbox-${{ matrix.copies }}-results.txt
      - name: Prebuilt BLAKE3 wheel for native recipient proofs
        run: |
          python -m pip install --only-binary=:all: blake3==1.0.11
      - name: Same replica modes through real authorized encrypted ETP mesh
        run: |
          set -o pipefail
          python ci/mailbox_mesh.py dist/native/ziokt_gateway ${{ matrix.copies }} 2>&1 | tee mailbox-mesh-${{ matrix.copies }}-results.txt
      - name: Same binaries on independent Python and Rust Unified executors
        if: matrix.copies == 1
        run: |
          set -o pipefail
          PYTHONPATH=. python ci/tc16_differential.py dist/native/tc16_unified_runner | tee tc16-differential-results.txt
      - name: Native Legacy frontend to Unified package and three real executors
        if: matrix.copies == 1
        run: |
          set -o pipefail
          PYTHONPATH=. python ci/tc16_legacy_differential.py dist/native/tc16_legacy_compiler dist/native/tc16_unified_runner | tee tc16-legacy-differential-results.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-replicas-${{ matrix.copies }}-evidence
          path: '*results.txt'
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix ci/browser --ignore-scripts --no-audit --no-fund
      - run: node ci/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Real browser application flows
        run: |
          set -o pipefail
          node tools/content_browser_smoke.cjs | tee browser-results.txt
          node tools/gui_offline_smoke.cjs | tee gui-offline-results.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: content-browser-evidence
          path: |
            browser-results.txt
            gui-offline-results.txt

  package_all:
    if: github.event_name == 'workflow_dispatch' && inputs.package_all
    needs: [content-network, native-replicas, browser, webextensions, feed-clients]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: Ziokt
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve pinned independent native repositories
        id: pins
        working-directory: Ziokt
        run: |
          python - <<'PYCODE'
          import json,os
          pins=json.load(open('native-sources.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for name in ('shadow6','corium'):
                  output.write(name+'='+pins[name]['revision']+'\n')
          PYCODE
      - uses: actions/checkout@v7.0.1
        with:
          repository: txmu/Shadow6
          ref: ${{ steps.pins.outputs.shadow6 }}
          path: Shadow6
      - uses: actions/checkout@v7.0.1
        with:
          repository: txmu/Corium
          ref: ${{ steps.pins.outputs.corium }}
          path: Corium
      - name: Build source and portable deliveries without local state
        working-directory: Ziokt
        run: |
          python -m pip install -r requirements.txt
          python ci/build.py
          python tools/package_webextensions.py
          python ci/package_source.py
      - name: Collect this exact run's native binaries and evidence
        working-directory: Ziokt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name native-content-runners --dir dist/native
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern '*-evidence' --dir dist/evidence
          python ci/package_content_delivery.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ziokt-package-all
          path: Ziokt/dist/ziokt-content-delivery-*
          if-no-files-found: error

  feed-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Independent FreshRSS and Miniflux consume RSS, Atom and JSON Feed
        run: |
          set -o pipefail
          python ci/feed_clients.py 2>&1 | tee feed-client-results.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: feed-clients-evidence
          path: |
            feed-client-results.txt
            feed-client-results.json

  webextensions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt selenium
      - run: npm ci --prefix ci/browser --ignore-scripts --no-audit --no-fund
      - run: node ci/browser/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Build deterministic localized client packages
        run: python tools/package_webextensions.py
      - name: Chromium extension with actual application service
        run: |
          set -o pipefail
          node tools/content_extension_smoke.cjs 2>&1 | tee chromium-extension-results.txt
      - name: Firefox extension with actual application service
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          export ZIOKT_FIREFOX_BINARY="$(node -e 'process.stdout.write(require("./ci/browser/node_modules/playwright").firefox.executablePath())')"
          PYTHONPATH=. python tools/content_extension_firefox.py 2>&1 | tee firefox-extension-results.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: webextensions-evidence
          path: |
            *extension-results.txt
            dist/extensions/*.zip
            dist/extensions/*.xpi
            dist/extensions/*.sha256
