name: Interoperability objects, native handoff and dual chat UI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 0'
permissions:
  contents: read
concurrency:
  group: interoperability-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  bounded-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Integrity, scope, quotas, process restart and reference lifetimes
        run: |
          python -m unittest discover -s tests -p test_chunkstore.py -v
          python -m unittest discover -s tests -p test_reference_packages.py -v
          python -m unittest discover -s tests -p test_mcp.py -k real_vault_cross_component_exchange -v
      - name: Stream 32 MiB with bounded memory and persisted midpoint restart
        env:
          ZIOKT_LARGE_OBJECT_MIB: '32'
        shell: bash
        run: |
          set -o pipefail
          ulimit -v 262144
          python -m unittest discover -s tests -p test_chunkstore.py -k LargeChunkTests -v 2>&1 | tee object-32.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: object-32-result
          path: object-32.log
          if-no-files-found: warn
  large-objects:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mib: [128, 384]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Hundreds of MiB, distinct chunks, restart and 256 MiB address-space cap
        env:
          ZIOKT_LARGE_OBJECT_MIB: ${{ matrix.mib }}
        shell: bash
        run: |
          set -o pipefail
          ulimit -v 262144
          python -m unittest discover -s tests -p test_chunkstore.py -v 2>&1 | tee object-large.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: object-${{ matrix.mib }}-result
          path: object-large.log
          if-no-files-found: warn
  native-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Ziokt
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: Ziokt
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Read pinned native revisions
        id: native
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          lock=json.loads(Path('native-sources.lock.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for name in ('shadow6','corium'):
                  output.write(name+'='+lock[name]['revision']+'\n')
          PY
      - uses: actions/checkout@v7.0.1
        with:
          repository: txmu/Shadow6
          ref: ${{ steps.native.outputs.shadow6 }}
          path: Shadow6
      - uses: actions/checkout@v7.0.1
        with:
          repository: txmu/Corium
          persist-credentials: false
          ref: ${{ steps.native.outputs.corium }}
          path: Corium
      - run: python -m pip install -r requirements.txt
      - name: Actual authenticated UFS HTTP and native Shadow6 prepare/commit
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p test_ufs_dcpm_native_integration.py -v 2>&1 | tee native-handoff.log
          python -m unittest discover -s tests -p test_control_native.py -v
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-handoff-result
          path: Ziokt/native-handoff.log
          if-no-files-found: warn
  dual-ui:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        ui: [simple, classic]
        viewport: [mobile, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix companions/watchat/WATChat-code --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix ci/browser --ignore-scripts --no-audit --no-fund
      - run: node ci/browser/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Media fixture encoder
        run: |
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }
      - name: Real encrypted chat and media with shared UI state
        env:
          WATCHAT_UI: ${{ matrix.ui }}
          WATCHAT_VIEWPORT: ${{ matrix.viewport }}
        shell: bash
        run: |
          set -o pipefail
          node tools/browser_smoke.cjs 2>&1 | tee browser.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: watchat-${{ matrix.ui }}-${{ matrix.viewport }}
          path: |
            browser.log
            dist/browser-artifacts/
          if-no-files-found: warn
