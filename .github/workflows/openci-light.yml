name: OpenCI lightweight C compiler and architecture admission
on:
  push:
    paths: ["ci/openci/light/**", "openci/light.py", "openci/web/light*", "openci/state.py", "openci/controller.py", "tests/test_openci_light.py", ".github/workflows/openci-light.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Pinned Emscripten on the CI VM only
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
      - name: Actual C to native ELF objects in a bounded WebAssembly compiler
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ci/openci/light/build.sh
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Admission, actual browser compile, signed output and independent verification
        run: |
          python -m pip install -r requirements.txt
          PYTHONPATH=tests:. python -m unittest -v test_openci_light
          npm ci --prefix ci/browser --ignore-scripts --no-audit --no-fund
          node ci/browser/node_modules/playwright/cli.js install --with-deps chromium --only-shell
          node ci/openci/light/browser_e2e.cjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: openci-light-compiler-${{ github.sha }}
          path: dist/light-compiler/
          if-no-files-found: error
