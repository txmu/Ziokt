name: Unified Mail identity, OAuth2 and MIME bridge acceptance
on:
  push:
    paths: ['ziokt/mail*.py', 'ziokt/cli.py', 'ziokt/mcp.py', 'tests/test_mail*.py', 'tests/test_unified_mail.py', 'ci/openci/alfs/boot.py', '.github/workflows/mail-bridge.yml']
  pull_request:
    paths: ['ziokt/mail*.py', 'ziokt/mcp.py', 'tests/test_mail*.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Isolated real TLS mail and Content Fabric, account and token isolation, recorded serial regression
        env:
          PYTHONPATH: 'tests:.'
        run: python -W error::ResourceWarning -m unittest test_mail_client test_mail_internet test_unified_mail -v
