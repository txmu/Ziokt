name: Ziokt companion sources and private PWA regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ziokt-companions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  applications:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Modern algebra, vault, package and TC-16 regression
        run: |
          python -m unittest discover -s tests -p test_companion_crypto.py -v
          python -m unittest discover -s tests -p test_airgap.py -v
          python -m unittest discover -s tests -p test_ano_laws.py -v
          python -m unittest discover -s tests -p test_ano_numeric_rpc.py -v
          python -m unittest discover -s tests -p test_component_links.py -v
          python -m unittest discover -s tests -p test_application_workflow.py -v
          python -m unittest discover -s tests -p test_web_deployment.py -v
          python -m unittest discover -s tests -p test_chunkstore.py -v
          python -m unittest discover -s tests -p test_reference_packages.py -v
          python -m unittest discover -s tests -p test_ufsdcpm.py -v
          python -m unittest discover -s tests -p test_dcpm_native_security.py -v
          python -m unittest discover -s tests -p 'test_ufs_*native*.py' -v
          python -m unittest discover -s tests -p test_tc16.py -v
          python -m unittest discover -s tests -p test_etp_adapter.py -v
          python -m unittest discover -s tests -p test_privacy_observer.py -v
          python -m unittest discover -s tests -p test_tri_integration.py -v
      - name: WATChat encrypted gateway, privacy, notifications and retry
        working-directory: companions/watchat/WATChat-code
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run check
      - name: SIM Manager types and PWA build
        working-directory: companions/sim-manager/src
        run: npm ci --ignore-scripts --no-audit --no-fund && npx tsc --noEmit && npm run build
      - name: Tri offline PWA and secure Ziokt federation adapter
        working-directory: companions/tri/app
        run: npm ci --ignore-scripts --no-audit --no-fund && npx tsc --noEmit && npm run build
      - name: Actual isolated browser ECDH chat and mobile PWA shell
        run: |
          npm ci --prefix ci/browser --ignore-scripts --no-audit --no-fund
          node ci/browser/node_modules/playwright/cli.js install --with-deps chromium --only-shell
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }
          node tools/browser_smoke.cjs
          node tools/sim_browser_smoke.cjs
          node tools/sim_storage_race_smoke.cjs
          node tools/tri_browser_smoke.cjs
          node tools/test_effort_network_events.cjs
          node tools/effort_browser_smoke.cjs
          python -W error::ResourceWarning -m unittest discover -s tests -p 'test_relay*.py' -v
          node tools/people_relay_browser_smoke.cjs
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: ziokt-companion-pwas
          path: |
            companions/tri/app/dist/
            companions/sim-manager/src/dist/
            companions/watchat/WATChat-code/frontend/
          if-no-files-found: error
  browser-engines:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci --prefix ci/browser --ignore-scripts --no-audit --no-fund
      - name: Install browser engine (CI binaries only)
        env:
          BROWSER: ${{ matrix.browser }}
        run: node ci/browser/node_modules/playwright/cli.js install --with-deps "$BROWSER"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Effort worker and read-only explorer across engines
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          node tools/test_effort_network_events.cjs
          node tools/effort_browser_smoke.cjs
          node tools/people_relay_browser_smoke.cjs
          node tools/explorer_browser_smoke.cjs
          node gui/build.js
          node tools/gui_browser_smoke.cjs
          node tools/gui_offline_smoke.cjs
  native-etp:
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, integrated]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companions/etp/src
      - name: ETP native core and gateway build (CI only)
        working-directory: companions/etp/src
        env:
          ETP_PROFILE: ${{ matrix.profile }}
        run: |
          if [ "$ETP_PROFILE" = minimal ]; then
            timeout 8m cargo test --locked --no-default-features --lib
            cargo build --locked --no-default-features --example ziokt_gateway
          else
            timeout 8m cargo test --locked --features tc16-tcc,dsl-runtime,ultrafileserver,ens-gateway,smart-contracts,safefs --lib
            cargo build --locked --features tc16-tcc,dsl-runtime,ultrafileserver,ens-gateway,smart-contracts,safefs --example ziokt_gateway
          fi
          strip target/debug/examples/ziokt_gateway
          sha256sum target/debug/examples/ziokt_gateway
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Python adapter with four real native ETP processes
        run: |
          python -m pip install -r requirements.txt
          if [ "${{ matrix.profile }}" = integrated ]; then
            python ci/etp_gateway_smoke.py companions/etp/src/target/debug/examples/ziokt_gateway --forum-required
          else
            python ci/etp_gateway_smoke.py companions/etp/src/target/debug/examples/ziokt_gateway --forum-unavailable
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ziokt-etp-gateway-${{ matrix.profile }}
          path: companions/etp/src/target/debug/examples/ziokt_gateway
          if-no-files-found: error
