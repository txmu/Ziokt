name: OpenCI Controller and isolated Runner
on:
  push:
    paths: ["openci/**", "companions/ufsdcpm/src/**", "ziokt/ufsdcpm.py", "tests/test_native*.py", "tests/test_openci*.py", "ci/openci/controller_runner_e2e.py", "ci/openci/test_openci_bootstrap.py", "ci/openci/runner-image.lock.json", ".github/workflows/openci-core.yml"]
  pull_request:
    paths: ["openci/**", "companions/ufsdcpm/src/**", "ziokt/ufsdcpm.py", "tests/test_native*.py", "tests/test_openci*.py", "ci/openci/**", ".github/workflows/openci-core.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openci-core-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  controller-and-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Real SQLite, concurrent leases, native encrypted storage and HTTP ACL
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_openci*.py' -v
      - name: Native dCPM reference distribution and rollback
        run: PYTHONPATH=tests:. python -W error::ResourceWarning -m unittest test_native_reference_distribution test_native_file_install -v
      - name: Pull immutable integration image on CI only
        run: |
          image=$(python -c 'import json;print(json.load(open("ci/openci/runner-image.lock.json"))["image"])')
          docker pull "$image"
      - name: Real OCI task, live logs, artifact verification and independent rebuild
        run: |
          set -o pipefail
          python ci/openci/controller_runner_e2e.py 2>&1 | tee openci-oci-e2e.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: openci-controller-runner-evidence
          path: openci-oci-e2e.log

  native-governance-settlement:
    strategy:
      fail-fast: false
      matrix:
        suite: [openci, work]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: Ziokt
          persist-credentials: false
      - id: native
        run: python Ziokt/ci/native_refs.py
      - uses: actions/checkout@v7.0.1
        with:
          repository: txmu/Corium
          ref: ${{ steps.native.outputs.corium }}
          path: Corium
          ssh-key: ${{ secrets.CORIUM_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Native execution dependencies only
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 jq openssl rsync curl gnupg
          python -m pip install --only-binary=:all: -r Ziokt/requirements.txt
      - name: Actual native governance, activation, settlement and independent Phoenix replay
        working-directory: Corium
        env:
          CORIUM_OPENCI_LIVE_CHAIN: '1'
          CORIUM_WORK_LIVE_CHAIN: '1'
        run: |
          set -o pipefail
          python -m unittest -v test_${{ matrix.suite }}_consensus 2>&1 | tee native-${{ matrix.suite }}-consensus.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-${{ matrix.suite }}-governance-settlement
          path: Corium/native-${{ matrix.suite }}-consensus.txt
